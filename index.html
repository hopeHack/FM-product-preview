<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <link rel="stylesheet" href="style.css" />
    <!-- Claude said: For what it's worth, when you do come back to it, the two concepts to sit with are just: containers need their own size before children's percentages mean anything, and centering an element ≠ centering its contents. -->
    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main>
      <div class="wrapper">
        <section class="section">
          <div class="split">
            <div class="adaptable-image">
              <picture>
                <source
                  media="(max-width: 600px)"
                  srcset="images/image-product-mobile.jpg"
                />
                <img
                  src="images/image-product-desktop.jpg"
                  alt="Gabrielle Chanel image"
                />
              </picture>
            </div>

            <article class="content-section">
              <div class="stack">
                <div class="descriptor">Perfume</div>
                <h1>Gabrielle Essence Eau De Parfum</h1>
                <p>
                  A floral, solar and voluptuous interpretation composed by
                  Olivier Polge, Perfumer-Creator for the House of CHANEL.
                </p>
                <div class="prices">
                  <h2 class="price">$149.99</h2>
                  <p class="old-price">$169.99</p>
                </div>
                <button>Add to Cart</button>
              </div>
              <!-- eo stack -->
            </article>
          </div>
          <!-- eo split -->
        </section>
      </div>
    </main>
  </body>
</html>
